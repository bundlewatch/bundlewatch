name: Deploy service

# Deploys packages/service to AWS with SAM. Authenticates with GitHub's OIDC token
# against the role created by packages/service/infra/bootstrap.yaml: no AWS keys
# are stored anywhere. Configure the `service-production` environment as described
# in packages/service/README.md.
#
# Only the deploy job can get AWS credentials or the OAuth secret, and it runs
# no code from the repository or its dependencies: it deploys the bundle that
# the build job built and tested.

on:
  push:
    branches: [main]
    paths:
      - packages/service/**
      - packages/core/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .nvmrc
      - .github/workflows/deploy-service.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-service
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter '@bundlewatch/service...'
      - run: pnpm --filter @bundlewatch/service test
      - run: pnpm --filter @bundlewatch/service build
      # The template and the function bundle, all that sam deploy needs.
      - name: Bundle
        id: bundle
        working-directory: packages/service
        run: |
          tar -czf "$RUNNER_TEMP/service.tgz" template.yaml dist
          echo "sha256=$(sha256sum "$RUNNER_TEMP/service.tgz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service
          path: ${{ runner.temp }}/service.tgz
          if-no-files-found: error
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: service-production
      url: https://service.bundlewatch.io
    permissions:
      id-token: write
    steps:
      # Installed before any credentials exist.
      - uses: aws-actions/setup-sam@89ddb14d60e682855e3fea4be85b3c56485de310 # v3
        with:
          use-installer: true
          version: 1.168.0
      # By id, so a replaced artifact can't be picked up, and checked against
      # the digest the build job computed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}
          merge-multiple: true
          digest-mismatch: error
      - name: Unpack
        working-directory: ${{ runner.temp }}
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "$SHA256  service.tgz" | sha256sum --check --strict
          mkdir service
          tar -xzf service.tgz -C service
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Require running protection state
        env:
          PROTECTION_STATE_TABLE: ${{ vars.PROTECTION_STATE_TABLE || 'bundlewatch-protection-state' }}
        run: |
          state=$(aws dynamodb get-item --table-name "$PROTECTION_STATE_TABLE" \
            --key '{"id":{"S":"service"}}' --consistent-read \
            --query 'Item.state.S' --output text)
          echo "$state" | jq -e '.status == "running"' > /dev/null || {
            echo 'Protection is uninitialized or shut down. Restore explicitly before deploying.'
            exit 1
          }
      - name: Deploy
        working-directory: ${{ runner.temp }}/service
        env:
          SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}
          CFN_EXECUTION_ROLE_ARN: ${{ vars.CFN_EXECUTION_ROLE_ARN }}
          WRITE_AUTHORIZATION: ${{ vars.WRITE_AUTHORIZATION || 'report' }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
        run: >-
          sam deploy
          --stack-name bundlewatch-service
          --s3-bucket "$SAM_ARTIFACT_BUCKET"
          --s3-prefix bundlewatch-service
          --role-arn "$CFN_EXECUTION_ROLE_ARN"
          --capabilities CAPABILITY_IAM
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          "GitSha=$GITHUB_SHA"
          "GitHubClientSecret=$OAUTH_CLIENT_SECRET"
          "WriteAuthorization=$WRITE_AUTHORIZATION"
      - name: Smoke test
        run: |
          url=$(aws cloudformation describe-stacks --stack-name bundlewatch-service \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" --output text)
          curl --fail --silent --show-error "$url/" | grep -q 'hello world'
