name: Website

# Build without AWS credentials, then upload the artifact on a fresh runner.
# Amplify hosts the finished files. See packages/website/README.md for setup.
on:
  push:
    branches: [main]
    # Keep in sync with scripts/website-inputs.mjs.
    paths:
      - packages/website/**
      - packages/bundlewatch/package.json
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - .github/workflows/website.yml
      - .github/workflows/website-preview.yml
      - .github/workflows/website-preview-deploy.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  build:
    # A PR can add a workflow named Release: accept only this repository's
    # release.yml running on a push. Manual deployments also run from main.
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.path == '.github/workflows/release.yml' &&
        github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter @bundlewatch/website
      - run: bash packages/website/scripts/build.sh
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-production
          path: packages/website/docs/.vitepress/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: website-production
      url: https://bundlewatch.io
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/website/scripts
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AMPLIFY_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy production
        env:
          GH_TOKEN: ${{ github.token }}
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
        run: node packages/website/scripts/amplify-deploy.mjs
