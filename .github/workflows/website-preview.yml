name: Website preview

# PR code, including forks, runs only in this read-only workflow. There are no
# AWS credentials or OIDC permissions, and no caches shared with trusted jobs.
# Fork PRs may not receive repository variables, so no job is gated on one.
# Without AMPLIFY_APP_ID, a website PR builds even when its preview is current.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  deployments: read

concurrency:
  group: website-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check website inputs
        id: changes
        run: node packages/website/scripts/preview.mjs build
        env:
          GH_TOKEN: ${{ github.token }}
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      - if: steps.changes.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - if: steps.changes.outputs.build == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.changes.outputs.build == 'true'
        run: pnpm install --frozen-lockfile --filter @bundlewatch/website
      - if: steps.changes.outputs.build == 'true'
        run: bash packages/website/scripts/build.sh
      - if: steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-preview-${{ github.event.pull_request.number }}
          path: packages/website/docs/.vitepress/dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
