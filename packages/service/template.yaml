AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: bundlewatch service (service.bundlewatch.io)
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  StoreTableName:
    Type: String
    Default: bundlewatch-service-store-table-prod
    Description: >-
      Existing baseline table, created by the 0.x Serverless stack. This stack
      only references it, so deleting the stack can never delete baselines.
  ResultsTableName:
    Type: String
    Default: bundlewatch-service-results
    Description: Table for short results links, created by this stack.
  ResultsRetentionDays:
    Type: Number
    Default: 0
    MinValue: 0
    Description: Days to keep short links; 0 keeps them forever.
  PublicUrl:
    Type: String
    Default: https://service.bundlewatch.io
    Description: Base URL used to build short links.
  GitHubClientId:
    Type: String
    Default: 04fcf325dd26ca2a159f
  GitHubClientSecret:
    Type: String
    NoEcho: true
  GitSha:
    Type: String
    Default: unknown
    Description: Deployed commit, shown in the results page footer.
  WriteAuthorization:
    Type: String
    Default: report
    AllowedValues: [report, enforce]
    Description: >-
      `report` authorizes saving baselines and short links like 0.x and logs
      where the stricter 1.0 check would decide differently. Switch to
      `enforce` once those logs are reviewed (see README.md).
  GitHubApiUrl:
    Type: String
    Default: https://api.github.com
    Description: >-
      GitHub API used to check tokens and for OAuth. Self-hosted services for
      GitHub Enterprise set their API URL, e.g. https://github.example.com/api/v3.

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Metadata:
      com.aws.cloudformation.Context:
        why: Explicit routes and throttling limit unsolicited Lambda executions.
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 10
      RouteSettings:
        'POST /store':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 2
        'POST /store/prefixed':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 2
        'POST /results':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 2
        'POST /analyze':
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 2

  ServiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        must: [Concurrency is exclusively controlled by the independent protection stack.]
    Properties:
      CodeUri: dist/
      Handler: lambda.handler
      # The newest Node.js LTS that Lambda supports for production. Move to
      # nodejs26.x once it leaves preview (AWS targets November 2026), along
      # with .nvmrc and the build target in tsdown.config.ts.
      Runtime: nodejs24.x
      Architectures: [arm64]
      MemorySize: 512
      Timeout: 29
      # Reserved concurrency is owned by infra/protection.yaml's controller.
      # Do not add it here: deployments must not reset an emergency shutdown.
      LoggingConfig:
        LogGroup: !Ref ServiceLogGroup
      Environment:
        Variables:
          STORE_TABLE: !Ref StoreTableName
          RESULTS_TABLE: !Ref ResultsTable
          RESULTS_RETENTION_DAYS: !Ref ResultsRetentionDays
          PUBLIC_URL: !Ref PublicUrl
          GITHUB_CLIENT_ID: !Ref GitHubClientId
          GITHUB_CLIENT_SECRET: !Ref GitHubClientSecret
          GIT_SHA1: !Ref GitSha
          WRITE_AUTHORIZATION: !Ref WriteAuthorization
          GITHUB_API_URL: !Ref GitHubApiUrl
      # Created by infra/bootstrap.yaml, with exactly the access it needs.
      Role: !ImportValue bundlewatch-service-function-role-arn
      Events:
        # Explicit routes reject scanner traffic before invoking Lambda.
        Home:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET
        HomeHead:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /, Method: HEAD }
        Store:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /store, Method: POST }
        Lookup:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /store/lookup, Method: POST }
        Capabilities:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /capabilities, Method: POST }
        PrefixedStore:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /store/prefixed, Method: POST }
        PrefixedLookup:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /store/prefixed/lookup, Method: POST }
        Results:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /results, Method: GET }
        ResultsHead:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /results, Method: HEAD }
        CreateResults:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /results, Method: POST }
        ShortLink:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/r/{id}', Method: GET }
        ShortLinkHead:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/r/{id}', Method: HEAD }
        Setup:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /setup-github, Method: GET }
        SetupHead:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /setup-github, Method: HEAD }
        Analyze:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /analyze, Method: POST }
        ResultsStyles:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /static/results-styles.css, Method: GET }
        ResultsStylesHead:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /static/results-styles.css, Method: HEAD }
        SetupStyles:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /static/setup-github-styles.css, Method: GET }
        SetupStylesHead:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /static/setup-github-styles.css, Method: HEAD }
        Logo:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /static/logo.svg, Method: GET }
        LogoHead:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /static/logo.svg, Method: HEAD }
        Font:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/static/fonts/{file}', Method: GET }
        FontHead:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: '/static/fonts/{file}', Method: HEAD }

  ServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /bundlewatch/service
      RetentionInDays: 30

  ResultsTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      com.aws.cloudformation.Context:
        why: Throughput limits bound request-driven growth while allowing a single large result.
    # Kept when the stack is deleted, but removed when the deploy that
    # created it fails, so a retry can create it again.
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref ResultsTableName
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput:
        MaxReadRequestUnits: 100
        # A single accepted baseline can consume up to 350 write units.
        MaxWriteRequestUnits: 400
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  ApiUrl:
    Description: The API's own endpoint, usable before the custom domain moves.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  FunctionName:
    Value: !Ref ServiceFunction
  ResultsTableName:
    Value: !Ref ResultsTable
