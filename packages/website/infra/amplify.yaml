AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  bundlewatch.io on AWS Amplify Hosting. GitHub Actions selects website changes
  for production and PR previews, built by Amplify (amplify.yml). Deployed
  by an administrator; see packages/website/README.md.

Parameters:
  GitHubRepository:
    Type: String
    Default: bundlewatch/bundlewatch
  GitHubAccessToken:
    Type: String
    NoEcho: true
    Description: >-
      Personal access token of a repository admin: fine-grained, for this
      repository only, with Webhooks read and write (or classic, with only
      admin:repo_hook). Amplify uses it once to connect through the Amplify
      GitHub App, and doesn't store it.
  GitHubEnvironment:
    Type: String
    Default: website-production
    Description: Only workflow jobs running in this GitHub environment can start release builds.
  CustomDomain:
    Type: String
    Default: ''
    Description: >-
      bundlewatch.io, once the site has been checked on its amplifyapp.com
      URL. Leave empty to deploy without a custom domain.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, '']]

Resources:
  App:
    Type: AWS::Amplify::App
    Properties:
      Name: bundlewatch-website
      Description: bundlewatch.io documentation site (packages/website)
      Repository: !Sub https://github.com/${GitHubRepository}
      AccessToken: !Ref GitHubAccessToken
      Platform: WEB
      # No IAMServiceRole and no secrets: preview branches contain untrusted
      # code, including code from forks.
      EnvironmentVariables:
        - Name: AMPLIFY_MONOREPO_APP_ROOT
          Value: packages/website
        # Actions filters all inputs, including root files and release events.
        - Name: AMPLIFY_DIFF_DEPLOY
          Value: 'false'
      EnableBranchAutoDeletion: true
      # The trusted Website preview workflow updates these refs only when
      # website inputs change, and deletes them when their PR closes.
      AutoBranchCreationConfig:
        EnableAutoBranchCreation: true
        AutoBranchCreationPatterns:
          - website-pr-*
        EnableAutoBuild: true
        EnablePullRequestPreview: false
        Stage: PULL_REQUEST
      # Clean URLs need no rule: Amplify serves /guide/x from /guide/x.html.
      # Headers are in customHttp.yml at the repository root.
      CustomRules:
        - !If
          - HasCustomDomain
          - Source: !Sub https://www.${CustomDomain}
            Target: !Sub https://${CustomDomain}
            Status: '301'
          - !Ref AWS::NoValue
        # 404-200 serves the 404 page with a 404 status. Amplify's 404
        # redirects instead, to a page that answers 200. A missing path
        # without an extension first gets a slash added (301), as Amplify
        # looks for a directory.
        - Source: /<*>
          Target: /404.html
          Status: '404-200'

  MainBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt App.AppId
      BranchName: main
      Description: Production
      Stage: PRODUCTION
      # website.yml starts production builds; website-preview.yml manages
      # preview refs. Native triggers would deploy unrelated changes too.
      EnableAutoBuild: false
      EnablePullRequestPreview: false

  Domain:
    Type: AWS::Amplify::Domain
    Condition: HasCustomDomain
    Properties:
      AppId: !GetAtt App.AppId
      DomainName: !Ref CustomDomain
      SubDomainSettings:
        - Prefix: ''
          BranchName: !GetAtt MainBranch.BranchName
        - Prefix: www
          BranchName: !GetAtt MainBranch.BranchName

  # The Website workflow builds main for website changes and releases.
  # Keep this logical ID and output stable for existing installations.
  # It can start builds and nothing else.
  ReleaseBuildRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Starts a build of the website's main branch from GitHub Actions
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: start-main-build
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: amplify:StartJob
                Resource: !Sub ${App.Arn}/branches/main/jobs/*

Outputs:
  AppId:
    Description: GitHub environment variable AMPLIFY_APP_ID
    Value: !GetAtt App.AppId
  ReleaseBuildRoleArn:
    Description: GitHub environment variable AMPLIFY_RELEASE_ROLE_ARN
    Value: !GetAtt ReleaseBuildRole.Arn
  DefaultUrl:
    Description: The production branch before the custom domain is added
    Value: !Sub https://main.${App.DefaultDomain}
