AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  bundlewatch.io artifact hosting. GitHub Actions builds the site and uploads
  it to Amplify. For the migration, CREATE a bundlewatch-website-artifacts
  stack; do not apply this template to the old Git-connected stack.

Parameters:
  GitHubRepository:
    Type: String
    Default: bundlewatch/bundlewatch
  GitHubEnvironment:
    Type: String
    Default: website-production
    Description: GitHub environment allowed to deploy production; restrict it to main.
  CustomDomain:
    Type: String
    Default: ''
    Description: Leave empty until production has been verified on its amplifyapp.com URL.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomain, '']]

Resources:
  App:
    Type: AWS::Amplify::App
    Properties:
      Name: !Ref AWS::StackName
      Description: bundlewatch.io static artifacts from GitHub Actions
      Platform: WEB
      # No repository connection, build service role, or native build triggers.
      EnableBranchAutoDeletion: false
      AutoBranchCreationConfig:
        EnableAutoBranchCreation: false
      CustomHeaders: |
        customHeaders:
          - pattern: '**/*'
            headers:
              - key: Strict-Transport-Security
                value: max-age=31556952
              - key: Access-Control-Allow-Origin
                value: '*'
              - key: X-Content-Type-Options
                value: nosniff
          - pattern: '/assets/**/*'
            headers:
              - key: Cache-Control
                value: public, max-age=31536000, immutable
          - pattern: '**/*.md'
            headers:
              - key: Content-Type
                value: text/markdown; charset=utf-8
          - pattern: '/llms*.txt'
            headers:
              - key: Content-Type
                value: text/plain; charset=utf-8
      # Amplify serves /guide/x from /guide/x.html. Keep the 404 status and
      # the www redirect used by the existing site.
      CustomRules:
        - !If
          - HasCustomDomain
          - Source: !Sub https://www.${CustomDomain}
            Target: !Sub https://${CustomDomain}
            Status: '301'
          - !Ref AWS::NoValue
        - Source: /<*>
          Target: /404.html
          Status: '404-200'

  MainBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt App.AppId
      BranchName: main
      Description: Production artifact destination
      Stage: PRODUCTION
      EnableAutoBuild: false
      EnablePullRequestPreview: false

  Domain:
    Type: AWS::Amplify::Domain
    Condition: HasCustomDomain
    Properties:
      AppId: !GetAtt App.AppId
      DomainName: !Ref CustomDomain
      SubDomainSettings:
        - Prefix: ''
          BranchName: !GetAtt MainBranch.BranchName
        - Prefix: www
          BranchName: !GetAtt MainBranch.BranchName

  ProductionDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Uploads website artifacts to the main Amplify destination
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy-production
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - amplify:GetBranch
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                Resource:
                  - !Sub ${App.Arn}/branches/main
                  # Deployment APIs also authorize against child resources such as deployments/*.
                  - !Sub ${App.Arn}/branches/main/*
              - Effect: Allow
                Action:
                  - amplify:GetJob
                  - amplify:StopJob
                Resource: !Sub ${App.Arn}/branches/main/jobs/*

  PreviewDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Publishes and removes pr-* artifact destinations; cannot deploy main
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Both publishing and cleanup use this main-only GitHub environment.
                # Untrusted pull_request builds cannot enter it.
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:website-preview
      Policies:
        - PolicyName: deploy-previews
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - amplify:CreateBranch
                  - amplify:GetBranch
                  - amplify:DeleteBranch
                  - amplify:CreateDeployment
                  - amplify:StartDeployment
                Resource: !Sub ${App.Arn}/branches/pr-*
              - Effect: Allow
                Action:
                  - amplify:GetJob
                  - amplify:StopJob
                Resource: !Sub ${App.Arn}/branches/pr-*/jobs/*

Outputs:
  AppId:
    Description: Repository variable AMPLIFY_APP_ID
    Value: !GetAtt App.AppId
  ProductionDeployRoleArn:
    Description: AMPLIFY_DEPLOY_ROLE_ARN in the website-production GitHub environment
    Value: !GetAtt ProductionDeployRole.Arn
  PreviewDeployRoleArn:
    Description: Repository variable AMPLIFY_PREVIEW_ROLE_ARN
    Value: !GetAtt PreviewDeployRole.Arn
  DefaultUrl:
    Description: Verify production here before moving the domain
    Value: !Sub https://main.${App.DefaultDomain}
