# Response headers for bundlewatch.io on AWS Amplify Hosting, in production
# and in pull request previews. Amplify reads this file from the repository
# root. The first two headers are the ones GitHub Pages sent.
applications:
  - appRoot: packages/website
    customHeaders:
      - pattern: '**/*'
        headers:
          - key: Strict-Transport-Security
            value: max-age=31556952
          - key: Access-Control-Allow-Origin
            value: '*'
          - key: X-Content-Type-Options
            value: nosniff
      # Built files have a content hash in their name.
      - pattern: '/assets/**/*'
        headers:
          - key: Cache-Control
            value: public, max-age=31536000, immutable
      # The documentation for LLMs and agents (docs/.vitepress/llms.mjs).
      - pattern: '**/*.md'
        headers:
          - key: Content-Type
            value: text/markdown; charset=utf-8
      - pattern: '/llms*.txt'
        headers:
          - key: Content-Type
            value: text/plain; charset=utf-8
